name: CI

# Aside from just this yml, you also need to enable 
# CodeQL and Secrets scanning in the repository settings 
# in GitHub. 

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# CI should not need to modify the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install ".[dev]"

      - name: Lint
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Audit dependencies
        run: |
          pip-audit --local

      - name: Test
        run: |
          pytest -v --durations=2

  build:
    name: Build and Verify Package
    runs-on: windows-latest
    needs: test

    permissions:
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools
          python -m pip install build
          python -m pip install twine

      - name: Build package
        run: |
          python -m build

      - name: Verify package contents
        run: |
          python -m twine check dist/*

      - name: Create runtime environment
        run: |
          python -m venv .sbom-venv
          .\.sbom-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.sbom-venv\Scripts\python.exe -m pip install .

      - name: Install SBOM generator
        run: |
          python -m pip install cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py environment .\.sbom-venv\Scripts\python.exe `
            --pyproject pyproject.toml `
            --output-format JSON `
            --output-file dist\socx-sbom.cdx.json `
            --output-reproducible

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl  
            dist/*.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: socx-package
          path: dist/
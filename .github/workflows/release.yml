name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: uv.lock

      - name: Install package
        run: uv sync --locked --group dev

      - name: Audit dependencies
        run: |
          uv run pip-audit --local

      - name: Lint
        run: |
          uv run ruff check .

      - name: Check formatting
        run: |
          uv run ruff format --check .

      - name: Test
        run: |
          uv run pytest

  validate-release:
    name: Validate Release Version
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG_NAME"]

          if not tag.startswith("v"):
              raise SystemExit(f"Invalid release tag: {tag}")

          tag_version = tag[1:]

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          package_version = project["version"]

          print(f"Git tag:       {tag}")
          print(f"Package:       {package_version}")

          if tag_version != package_version:
              raise SystemExit(
                  f"Version mismatch: tag is {tag_version}, "
                  f"but pyproject.toml contains {package_version}"
              )

          print("Version validation passed.")
          PY
  
  build:
    name: Build Release
    runs-on: windows-latest
    needs: validate-release

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: uv.lock

      - name: Install package
        run: uv sync --locked --group dev

      - name: Build package
        run: |
          uv run python -m build

      - name: Check package
        run: |
          uv run python -m twine check dist/*

      - name: Create runtime environment
        run: |
          python -m venv .sbom-venv
          uv export --no-dev --format requirements-txt -o requirements-runtime.txt
          .\.sbom-venv\Scripts\python.exe -m pip install --require-hashes -r requirements-runtime.txt
          .\.sbom-venv\Scripts\python.exe -m pip install . --no-deps

      - name: Generate SBOM
        run: |
          uv run cyclonedx-py environment .\.sbom-venv\Scripts\python.exe `
            --pyproject pyproject.toml `
            --output-format JSON `
            --output-file dist\socx-sbom.cdx.json `
            --output-reproducible

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: socx-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: socx-sbom
          path: dist/*.cdx.json

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: socx-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Verify TestPyPI Release
    runs-on: windows-latest
    needs: publish-testpypi

    permissions:
      contents: read
      attestations: read

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install from TestPyPI
        shell: pwsh
        run: |
          python -m pip install `
            --index-url https://test.pypi.org/simple/ `
            --extra-index-url https://pypi.org/simple/ `
            "socx==$env:VERSION"

      - name: Verify installation
        shell: pwsh
        run: |
          socx --help

      - name: Download wheel from TestPyPI
        shell: pwsh
        run: |
          python -m pip download `
            --no-deps `
            --only-binary=:all: `
            --index-url https://test.pypi.org/simple/ `
            "socx==$env:VERSION"

      - name: Verify artifact attestation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify `
            "socx-$env:VERSION-py3-none-any.whl" `
            -R enlace-one/socx

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify-testpypi

    environment:
      name: pypi
      url: https://pypi.org/p/socx

    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
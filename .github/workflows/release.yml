name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip 
          python -m pip install --upgrade setuptools
          python -m pip install ".[dev]"

      - name: Audit dependencies
        run: |
          pip-audit --local

      - name: Lint
        run: |
          ruff check .

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Test
        run: |
          pytest

  validate-release:
    name: Validate Release Version
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG_NAME"]

          if not tag.startswith("v"):
              raise SystemExit(f"Invalid release tag: {tag}")

          tag_version = tag[1:]

          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]

          package_version = project["version"]

          print(f"Git tag:       {tag}")
          print(f"Package:       {package_version}")

          if tag_version != package_version:
              raise SystemExit(
                  f"Version mismatch: tag is {tag_version}, "
                  f"but pyproject.toml contains {package_version}"
              )

          print("Version validation passed.")
          PY
  
  build:
    name: Build Release
    runs-on: windows-latest
    needs: validate-release

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip 
          python -m pip install --upgrade setuptools
          python -m pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          python -m twine check dist/*

      - name: Create runtime environment
        run: |
          python -m venv .sbom-venv
          .\.sbom-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.sbom-venv\Scripts\python.exe -m pip install .

      - name: Install SBOM generator
        run: |
          python -m pip install cyclonedx-bom

      - name: Generate SBOM
        run: |
          cyclonedx-py environment .\.sbom-venv\Scripts\python.exe `
            --pyproject pyproject.toml `
            --output-format JSON `
            --output-file dist\socx-sbom.cdx.json `
            --output-reproducible

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: socx-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: socx-sbom
          path: dist/*.cdx.json

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: socx-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/